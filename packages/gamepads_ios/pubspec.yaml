name: gamepads_ios
description: iOS implementation of gamepads, a Flutter plugin to handle gamepad input across multiple platforms.
version: 0.1.3+3
homepage: https://github.com/flame-engine/gamepads
repository: https://github.com/flame-engine/gamepads/tree/main/packages/gamepads_ios

flutter:
  plugin:
    implements: gamepads
    platforms:
      ios:
        pluginClass: GamepadsIosPlugin

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  gamepads_platform_interface:
    git:
      url: https://github.com/yj-labs/gamepads.git
      ref: dev
      path: packages/gamepads_platform_interface


dev_dependencies:
  flame_lint: ^1.4.1
  flutter_test:
    sdk: flutter
