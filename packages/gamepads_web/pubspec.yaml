name: gamepads_web
publish_to: none
description: Web implementation of gamepads, a Flutter plugin to handle gamepad input across multiple platforms.
version: 0.1.1+1
homepage: https://github.com/yj-labs/gamepads
repository: https://github.com/yj-labs/gamepads

flutter:
  plugin:
    implements: gamepads
    platforms:
      web:
        pluginClass: GamepadsWeb
        fileName: gamepads_web.dart

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  gamepads_platform_interface:
    path: ../gamepads_platform_interface
  plugin_platform_interface: ^2.1.8
  web: ^1.1.0

dev_dependencies:
  flame_lint: ^1.4.1
  flutter_test:
    sdk: flutter
