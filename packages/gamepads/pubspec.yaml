name: gamepads
publish_to: none
description: A Flutter plugin to handle gamepad input across multiple platforms.
version: 0.1.10+2
homepage: https://github.com/yj-labs/gamepads
repository: https://github.com/yj-labs/gamepads/tree/dev/packages/gamepads

flutter:
  plugin:
    platforms:
      android:
        default_package: gamepads_android
      ios:
        default_package: gamepads_ios
      linux:
        default_package: gamepads_linux
      macos:
        default_package: gamepads_darwin
      windows:
        default_package: gamepads_windows
      web:
        default_package: gamepads_web

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  gamepads_android:
    path: ../gamepads_android
  gamepads_darwin:
    path: ../gamepads_darwin
  gamepads_ios:
    path: ../gamepads_ios
  gamepads_linux:
    path: ../gamepads_linux
  gamepads_platform_interface:
    path: ../gamepads_platform_interface
  gamepads_web:
    path: ../gamepads_web
  gamepads_windows:
    path: ../gamepads_windows

dev_dependencies:
  flame_lint: ^1.4.1
  flutter_test:
    sdk: flutter
